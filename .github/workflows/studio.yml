name: Content Studio

on:
  schedule:
    - cron: "30 1 * * *"  # 01:30 UTC = 7:00 AM IST, every day
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Create topics, posts and newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSLETTER_NOW: ${{ vars.NEWSLETTER_NOW }}
        run: python studio.py
      - name: Save the page
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add docs
          git commit -m "Content Studio $(date +%F)" || echo "No changes"
          git push
